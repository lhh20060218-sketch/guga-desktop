const stage = document.getElementById('stage');
for (const s of SLIDES) {
  const d = document.createElement('section');
  d.className = 'slide';
  d.dataset.no = s.no;
  const inner = document.createElement('div');
  inner.className = 'inner' + (s.blocks.length > 14 ? ' cols' : '');
  for (const b of s.blocks) {
    const p = document.createElement('div');
    p.className = 'blk ' + b.tier;
    p.textContent = b.t;
    inner.appendChild(p);
  }
  d.appendChild(inner);
  const n = document.createElement('div');
  n.className = 'pageno';
  n.textContent = String(s.no).padStart(2,'0') + ' / ' + String(SLIDES.length).padStart(2,'0');
  d.appendChild(n);
  stage.appendChild(d);
}
function fit(slide){
  const inner = slide.querySelector('.inner');
  let fs = 30;
  inner.style.fontSize = fs + 'px';
  while (fs > 9 && (inner.scrollHeight > inner.clientHeight + 1 || inner.scrollWidth > inner.clientWidth + 1)) {
    fs -= 1;
    inner.style.fontSize = fs + 'px';
  }
}
let cur = 0, fitted = new WeakSet();
const slides = [...document.querySelectorAll('.slide')];
function show(i){
  cur = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s,k)=>s.classList.toggle('active', k === cur));
  const s = slides[cur];
  if(!fitted.has(s)){ fit(s); fitted.add(s); }
  document.getElementById('pos').textContent = (cur+1) + ' / ' + slides.length;
  document.getElementById('bar').style.width = ((cur+1)/slides.length*100) + '%';
}
document.getElementById('prev').onclick = ()=>show(cur-1);
document.getElementById('next').onclick = ()=>show(cur+1);
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(cur+1)}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();show(cur-1)}
  if(e.key==='Home'){show(0)} if(e.key==='End'){show(slides.length-1)}
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}
    else{document.exitFullscreen?.()}
  }
});
stage.addEventListener('click', e=>{
  if(!slides[cur].classList.contains('active')) return;
  const r = stage.getBoundingClientRect();
  show(e.clientX < r.left + r.width*0.35 ? cur-1 : cur+1);
});
addEventListener('resize', ()=>{ fitted = new WeakSet(); fit(slides[cur]) && 0; fitted.add(slides[cur]); });
show(0);
